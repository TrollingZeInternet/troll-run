<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TROLL GAMES | Problem?</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #app {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 900px;
      background:
        radial-gradient(ellipse at 50% 18%, rgba(0,255,136,0.10), transparent 52%),
        linear-gradient(180deg, #0c1018 0%, #0a0a12 55%, #07070c 100%);
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,255,100,0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px 24px 72px;
    }
    .menu-logo {
      width: 176px;
      height: auto;
      display: block;
      margin: 0 auto 20px;
      object-fit: contain;
      background: transparent;
    }
    h1 {
      font-size: 42px;
      color: #00ff88;
      text-shadow: 0 0 24px #00ff88;
      margin-bottom: 6px;
      letter-spacing: -1px;
    }
    .subtitle {
      font-size: 16px;
      color: #999;
      margin-bottom: 32px;
    }
    .btn {
      display: block;
      width: min(280px, 100%);
      background: #00ff88;
      color: #000;
      border: none;
      padding: 16px 28px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 50px;
      cursor: pointer;
      margin: 8px auto;
      box-shadow: 0 4px 18px rgba(0,255,136,0.35);
      transition: transform 0.1s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-decoration: none;
      text-align: center;
    }
    .btn:active { transform: scale(0.95); }
    .btn.secondary {
      background: transparent;
      color: #00ff88;
      border: 2px solid #00ff88;
      box-shadow: none;
    }
    .token-info {
      position: absolute;
      bottom: 16px;
      left: 0; right: 0;
      text-align: center;
      font-size: 10px;
      color: #444;
    }
    .token-info a { color: #00ff88; text-decoration: none; }
  </style>
</head>
<body>
  <div id="app">
    <img src="Trollface.png" alt="Trollface" class="menu-logo">
    <h1>TROLL GAMES</h1>
    <div class="subtitle">Problem? 😈</div>
    <a class="btn" href="run.html">TROLL RUN</a>
    <a class="btn" href="hodl.html">TROLL HODL</a>
    <div class="token-info">
      $TROLL on Ethereum<br>
      <a href="https://troll.run" target="_blank">troll.run</a> · CA: 0xf8eb…eB3A
    </div>
  </div>
</body>
</html>
